<div class="layout">
    <app-sidebar></app-sidebar>

    <main class="layout__content">
        <div class="layout__header">
            <div>
                <h1 class="layout__title">Users</h1>
                <p class="layout__subtitle">Approve or reject accounts</p>
            </div>
        </div>
        <div class="table-card">
            <table class="users-table">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let u of users">
                        <td>{{ u.firstName }} {{ u.lastName }}</td>
                        <td>{{ u.email }}</td>
                        <td>{{ u.role }}</td>
                        <td>
                            <span
                                class="status-badge"
                                [class]="'status-badge--' + u.status"
                                >{{ u.status }}</span
                            >
                        </td>
                        <td class="actions-cell">
                            <ng-container *ngIf="u.status === 'pending'">
                                <app-button (clicked)="approve(u.id)">Approve</app-button>
                                <app-button variant="danger" (clicked)="reject(u.id)">Reject</app-button>
                            </ng-container>

                            <div class="menu" *ngIf="u.status !== 'pending' && u.role === 'student'">
                                <button class="menu__trigger" (click)="toggleMenu(u.id, $event)" aria-label="Open actions">⋯</button>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>

            <p class="empty-state" *ngIf="users.length === 0">No users yet.</p>
        </div>
        <div
            class="menu__dropdown"
            *ngIf="openMenuId"
            [style.top.px]="menuPosition.top"
            [style.left.px]="menuPosition.left"
        >
            <button class="menu__item" (click)="update(openMenuId)">Update</button>
            <button class="menu__item menu__item--danger" (click)="remove(openMenuId)">Delete</button>
        </div>

        <div class="modal-backdrop" *ngIf="editingUser" (click)="cancelEdit()">
            <div class="modal-card" (click)="$event.stopPropagation()">
                <h2 class="modal-card__title">Edit User</h2>

                <form [formGroup]="editForm" (ngSubmit)="saveEdit()">
                <label class="field">
                    <span class="field__label">First name</span>
                    <input type="text" formControlName="firstName" class="field__input" />
                </label>

                <label class="field">
                    <span class="field__label">Last name</span>
                    <input type="text" formControlName="lastName" class="field__input" />
                </label>

                <label class="field">
                    <span class="field__label">Role</span>
                    <select formControlName="role" class="field__input">
                    <option value="student">Student</option>
                    <option value="supervisor">Supervisor</option>
                    </select>
                </label>

                <div class="modal-card__actions">
                    <app-button variant="secondary" type="button" (clicked)="cancelEdit()">Cancel</app-button>
                    <app-button variant="primary" type="submit" [disabled]="editForm.invalid">Save</app-button>
                </div>
                </form>
            </div>
        </div>
    </main>
</div>
