<div class="layout">
  <app-sidebar></app-sidebar>

  <main class="layout__content">
    <h1 class="layout__title">News</h1>
    <p class="layout__subtitle">Announcements from supervisors</p>

    <div class="posts">
      <article class="post" *ngFor="let post of posts">
        <div class="post__header">
          <h2 class="post__title">{{ post.title }}</h2>
          <span class="post__meta">{{ post.author }}</span>
        </div>
        <p class="post__body">{{ post.body }}</p>
      </article>

      <p class="empty-state" *ngIf="posts.length === 0">No news yet.</p>
    </div>
  </main>
</div>
