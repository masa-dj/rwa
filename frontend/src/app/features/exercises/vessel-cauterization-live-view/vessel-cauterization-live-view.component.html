<div class="live-view" *ngIf="snapshot">
  <div class="live-view__hud">
    <span class="live-view__timer">{{ formatTime(snapshot.timeRemaining) }}</span>
    <span class="live-view__score">Sealed: {{ snapshot.sealedCount }}</span>
  </div>

  <div class="live-view__canvas">
    <div
      class="pointer-dot"
      *ngIf="snapshot?.pointer"
      [style.left.px]="snapshot!.pointer!.x"
      [style.top.px]="snapshot!.pointer!.y"
    ></div>
    <div
      class="target"
      *ngFor="let t of snapshot.targets"
      [style.left.px]="t.x - t.radius"
      [style.top.px]="t.y - t.radius"
      [style.width.px]="t.radius * 2"
      [style.height.px]="t.radius * 2"
    >
      <svg class="target__ring" [attr.viewBox]="'0 0 ' + (t.radius * 2) + ' ' + (t.radius * 2)">
        <circle class="target__ring-bg" [attr.cx]="t.radius" [attr.cy]="t.radius" [attr.r]="t.radius - 3" />
        <circle
          class="target__ring-progress"
          [attr.cx]="t.radius" [attr.cy]="t.radius" [attr.r]="t.radius - 3"
          [style.stroke-dasharray]="2 * 3.14159 * (t.radius - 3)"
          [style.stroke-dashoffset]="2 * 3.14159 * (t.radius - 3) * (1 - t.holdProgress)"
        />
      </svg>
    </div>
  </div>
</div>
