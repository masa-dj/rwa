<div class="live-view" *ngIf="snapshot">
    <div class="live-view__hud">
        <span class="live-view__timer">{{
            formatTime(snapshot.timeRemaining)
        }}</span>
        <span class="live-view__key" [class.is-held]="snapshot.isKeyHeld"
            >HOLD [ {{ snapshot.activeKey }} ]</span
        >
        <span class="live-view__score"
            >Stitch {{ snapshot.activeIndex + 1 }} /
            {{ snapshot.stitches.length }}</span
        >
    </div>

    <div class="live-view__canvas">
        <svg viewBox="0 0 560 360" class="live-view__svg">
            <line x1="40" y1="180" x2="520" y2="180" class="wound-line" />

            <g *ngFor="let s of snapshot.stitches; let i = index">
                <line
                    *ngIf="i === snapshot.activeIndex"
                    [attr.x1]="s.entry.x"
                    [attr.y1]="s.entry.y"
                    [attr.x2]="s.exit.x"
                    [attr.y2]="s.exit.y"
                    class="stitch__corridor"
                    [class.is-held]="snapshot.isKeyHeld"
                />
                <circle
                    [attr.cx]="s.entry.x"
                    [attr.cy]="s.entry.y"
                    r="10"
                    class="stitch__point"
                    [class.is-active]="s.status === 'active'"
                    [class.is-completed]="s.status === 'completed'"
                    [class.is-missed]="s.status === 'missed'"
                />
                <circle
                    [attr.cx]="s.exit.x"
                    [attr.cy]="s.exit.y"
                    r="10"
                    class="stitch__point"
                    [class.is-active]="s.status === 'active'"
                    [class.is-completed]="s.status === 'completed'"
                    [class.is-missed]="s.status === 'missed'"
                />
            </g>

            <circle
                *ngIf="snapshot.cursor"
                [attr.cx]="snapshot.cursor.x"
                [attr.cy]="snapshot.cursor.y"
                r="7"
                class="cursor-dot"
                [class.is-out]="snapshot.isOutOfBounds"
            />
        </svg>
    </div>
</div>
