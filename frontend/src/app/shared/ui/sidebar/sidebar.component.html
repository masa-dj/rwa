<div class="mobile-header">
    <button class="mobile-header__toggle" (click)="toggleSidebar()" aria-label="Toggle menu">
        <ng-container *ngComponentOutlet="isOpen ? CloseIcon : MenuIcon"></ng-container>
    </button>
</div>

<div class="sidebar-overlay" *ngIf="isOpen" (click)="toggleSidebar()"></div>

<aside class="sidebar" [class.is-open]="isOpen">
    <div class="sidebar__brand">
        <span class="sidebar__name">{{ userName }}</span>
    </div>

    <nav class="sidebar__nav">
        <a
            *ngFor="let item of navItems"
            [routerLink]="item.route"
            routerLinkActive="is-active"
            class="sidebar__link"
        >
            <ng-container *ngComponentOutlet="item.icon"></ng-container>
            <span>{{ item.label }}</span>
        </a>
    </nav>

    <div class="sidebar__bottom">
        <a
            *ngIf="isSupervisor"
            [routerLink]="usersNavItem.route"
            routerLinkActive="is-active"
            class="sidebar__link"
        >
            <ng-container *ngComponentOutlet="usersNavItem.icon"></ng-container>
            <span>{{ usersNavItem.label }}</span>
            <span
                class="sidebar__badge"
                *ngIf="hasPendingUsers$ | async"
                title="Pending user approvals"
            >
                <ng-container *ngComponentOutlet="Alert"></ng-container>
            </span>
        </a>

        <div class="sidebar__footer">
            <app-button variant="ghost-inverse" (clicked)="logout()">
                <ng-container *ngComponentOutlet="LogOutIcon"></ng-container>
                <span>Logout</span>
            </app-button>
        </div>
    </div>
</aside>
